name: CI

# The app updates itself from this repo's releases, so a broken build does not
# stay on the shelf — it reaches phones at the next launch. Everything below
# runs on every push so a release is never cut from an untested tree.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Checks the shipped assets themselves: polyphones, word boundaries, and
      # the UTF-16 sort order the app binary-searches. A regression here would
      # be invisible to the Kotlin tests.
      - name: Verify dictionary assets
        run: python3 tools/verify_engine.py

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/
            app/build/test-results/
